[project]
name = "sgbridge"
version = "0.1.0"
description = "Deploy SGLang and put Claude Code in front of it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shyam Sudhakaran", email = "shyamsnair@protonmail.com" }]
keywords = ["sglang", "claude-code", "llm", "inference", "modal"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6",
    "starlette>=0.41",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
modal = ["modal>=1.6"]

[project.urls]
Repository = "https://github.com/shyamsn97/sgbridge"

[project.scripts]
sgbridge = "sgbridge.cli:main"

[dependency-groups]
dev = [
    "anthropic>=0.70",
    "mypy>=1.13",
    "openai>=3.55.1",
    "pydantic>=2.14.3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sgbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sgbridge"]

[[tool.mypy.overrides]]
module = ["modal", "modal.*", "huggingface_hub"]
ignore_missing_imports = true
